name: Build Windows app and publish release

on:
  push:
    tags:
      - 'v2.*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B -ntp clean verify

      - name: Create standalone Windows app with bundled Java
        shell: pwsh
        run: |
          jpackage --type app-image `
            --name OrderManagement `
            --dest dist `
            --input target `
            --main-jar guillermo-2.0.0.jar `
            --main-class com.uem.Main `
            --icon packaging/app.ico `
            --add-modules java.desktop,java.net.http,jdk.crypto.ec
          Compress-Archive -Path "dist/OrderManagement" -DestinationPath "dist/OrderManagement-Windows.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: 'Order Management v2.0.0'
          generate_release_notes: true
          files: |
            dist/OrderManagement-Windows.zip
            target/guillermo-2.0.0.jar
